# chain-mon example configuration
#
# Copy to config.yaml (git-ignored) and edit:
#   cp config.example.yaml config.yaml
#
# rpc_url values may reference environment variables as ${VAR}. With docker compose,
# variables are read from a .env file next to docker-compose.yml (also git-ignored).
# Use this to keep API keys out of the config file.

# Port the /metrics HTTP endpoint listens on.
# Optional, default: 9877
listen_port: 9877

# Seconds between polls of each chain.
# Optional, default: 15
poll_interval: 15

# Timeout in seconds for each JSON-RPC request.
# Optional, default: 10
timeout: 10

# Chains to monitor. Each chain is polled in its own thread.
#
# Per-chain keys:
#   name        Required. Value of the `chain` label on every metric.
#   rpc_url     Required. JSON-RPC HTTP(S) endpoint. Never logged.
#   finalized   Optional, default true. Poll eth_getBlockByNumber("finalized") and export
#               evm_finalized_block_*. Set false if the chain/client lacks the tag.
#   peer_count  Optional, default true. Poll net_peerCount and export evm_peer_count.
#               Set false for endpoints that block it (common with hosted providers).
#
# If any enabled call fails, the whole poll counts as failed: evm_rpc_up becomes 0
# and evm_rpc_errors_total increases. Disable what the endpoint does not support.
chains:
  # Own node: optional keys omitted, so latest + finalized + peer count are all polled.
  - name: ethereum
    rpc_url: https://<ETH_RPC_HOST>

  # Hosted provider, URL with API key read from the environment (.env):
  #   BSC_RPC_URL=https://<PROVIDER_HOST>/<API_KEY>
  - name: bsc
    rpc_url: ${BSC_RPC_URL}
    peer_count: false

  # Chain or client without the "finalized" tag.
  - name: example-l2
    rpc_url: https://<L2_RPC_HOST>
    finalized: false
